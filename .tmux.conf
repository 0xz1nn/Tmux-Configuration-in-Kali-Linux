# ==================================================
# 0xZ1nn — tmux configuration
# ==================================================


# --------------------------------------------------
# Clipboard
# --------------------------------------------------

# Copy selected text to system clipboard with xclip.
# Uncomment if you want y to also pipe directly to
# the system clipboard.
#
# bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel \
     "xclip -selection clipboard -in"

# y = system clipboard only, not tmux buffer

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xsel --clipboard --input"

# No xsel? sudo apt install xsel

#bind-key -T copy-mode-vi v send-keys -X begin-selection
#bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel


# --------------------------------------------------
# Shell
# --------------------------------------------------

set -g default-shell /usr/bin/zsh


# --------------------------------------------------
# Prefix
# --------------------------------------------------

set -g prefix C-a
unbind C-b
bind C-a send-prefix


# --------------------------------------------------
# Mouse / Copy Mode
# --------------------------------------------------

set -g mouse on
setw -g mode-keys vi


# --------------------------------------------------
# Terminal
# --------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-overrides ',*:Tc'


# --------------------------------------------------
# Theme
# --------------------------------------------------

# Graphite palette
#
# Background   #2A2B2D
# Panel        #11161C
# Border       #2A313B
# Text         #C4C7CD
# Muted        #7A8492
# Accent       #FF404D
# White        #FFFFFF

# Status bar
set -g status-style "bg=#11161C,fg=#C4C7CD"
set -g status-position top
set -g status-justify centre


# --------------------------------------------------
# Status — Left
# --------------------------------------------------

set -g status-left-length 25
set -g status-left "#[fg=#FF404D,bold] #S "


# --------------------------------------------------
# Status — Right
# --------------------------------------------------

set -g status-right-length 40
set -g status-right "#[fg=#FF404D] void #[fg=#FFFFFF,bold]✦ #[fg=#FF404D]execute #[fg=#FF404D,bold]⚡ "

# --------------------------------------------------
# Pane Borders
# --------------------------------------------------

set -g pane-border-style "fg=#2A313B"
set -g pane-active-border-style "fg=#FF404D"


# --------------------------------------------------
# Copy Mode
# --------------------------------------------------

# Graphite + red instead of the old yellow/black mode.
#set -g mode-style "bg=#FF404D,fg=#2A2B2D,bold"
#set -g mode-style "bg=#00FF00,fg=#000000,bold"
set -g mode-style "bg=#3A4756,fg=#C4C7CD,bold"

# --------------------------------------------------
# Messages
# --------------------------------------------------

set -g message-style "bg=#FF404D,fg=#2A2B2D,bold"


# --------------------------------------------------
# History
# --------------------------------------------------

set -g history-limit 100000


# --------------------------------------------------
# Logging
# --------------------------------------------------

run-shell /opt/tmux-logging/logging.tmux


# --------------------------------------------------
# Windows
# --------------------------------------------------

# Automatically name windows based on the running command
set -g automatic-rename on
set -g automatic-rename-format '#{pane_current_command}'

# Inactive windows
set -g window-status-format \
    "#[fg=#7A8492,bg=#11161C] #I:#W "

# Active window
set -g window-status-current-format \
    "#[fg=#2A2B2D,bg=#FF404D,bold] #I:#W "

set -g window-status-separator " "

# New windows inherit the current directory
bind c new-window -c "#{pane_current_path}"

# --------------------------------------------------
# Splits
# --------------------------------------------------

# Horizontal split
bind | split-window -h -c "#{pane_current_path}"

# Vertical split
bind - split-window -v -c "#{pane_current_path}"

# Remove default split bindings
unbind '"'
unbind %
